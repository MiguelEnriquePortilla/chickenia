name: ChickenIA inventory checks
on:
  push:
    paths: ['ChickenIA/**', '.github/workflows/inventory.yml']
  pull_request:
    paths: ['ChickenIA/**', '.github/workflows/inventory.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChickenIA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ChickenIA/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: NODE_BINARY=$(command -v node) python test/inventory_browser.py
