<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="CSRF_TOKEN"><title>foodIA · Captura diaria</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><img class="brand-logo" src="/icons/icon-192.jpg" alt="Chicken Chicanito"><div class="brand-name"><strong>CHICKENIA</strong><span>Control diario · foodIA</span></div><span class="pilot" id="environment">Pruebas locales</span><a id="dashboard-link" class="dashboard-link" href="/dashboard.html" hidden>Dashboard</a><span class="branch">Jojutla Mercado</span></header>
<main><div class="heading"><div><h1 id="title">Cierre de Caja</h1><p id="save-status" role="status">Abriendo captura…</p></div><label class="date">Fecha<input id="date" type="date"></label></div>
<nav class="modules" aria-label="Captura"><button data-mode="close" aria-pressed="true">Cierre de Caja</button><button data-mode="production" aria-pressed="false">Producción</button></nav>

<dialog id="confirm"><h2>Finalizar esta captura</h2><p id="final-description">Quedará guardada como finalizada en pruebas locales, sin envío a Telegram ni cambios de inventario.</p><div><button id="cancel-final" type="button">Seguir editando</button><button id="yes-final" class="primary" type="button">Finalizar</button></div></dialog></body></html>
