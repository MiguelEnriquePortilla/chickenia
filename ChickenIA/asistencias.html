<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17213e"><title>Asistencias · Chicken ChicanIA</title>
<link rel="icon" href="/icons/chicania-launch-32.png"><link rel="manifest" href="/manifest.json"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/js/theme-init.js"></script><link rel="stylesheet" href="/css/area-navigation.css"><link rel="stylesheet" href="/css/shared-shell.css"><link rel="stylesheet" href="/css/payroll.css">
<script defer src="/js/area-navigation.js"></script><script defer src="/js/shared-shell.js"></script><script defer src="/js/payroll-domain.js"></script><script defer src="/js/payroll.js"></script><script defer src="/js/name-access.js"></script>
</head><body data-shared-standalone="true" data-personnel-view="attendance">
<main id="personal-app" class="personnel-main">
<div class="page-heading"><h1>Asistencias</h1><p id="identity" class="quiet"></p><button id="change-person" class="text-action" type="button" hidden>Cambiar responsable</button></div>
<section id="login-panel" hidden><h2>Acceso a Chicken ChicanIA</h2><form id="login-form"><p>Selecciona tu nombre para registrar tus capturas.</p><label>¿Quién está capturando?<select name="username" required><option value="">Selecciona tu nombre</option></select></label><button class="primary" type="submit">Entrar</button></form></section>
<div class="save-message" role="status" aria-live="polite"><span id="status">Cargando…</span><button type="button" id="retry" hidden>Reintentar</button><button type="button" id="recover" hidden>Recuperar guardado</button></div>
<section id="workspace" hidden><div class="context-fields"><label id="date-label">Fecha<input id="date" type="date"></label><p id="period" class="quiet"></p></div>
<div class="view-tabs" role="group" aria-label="Vista de asistencias"><button type="button" data-view="person" aria-pressed="true">Por persona</button><button type="button" data-view="team" aria-pressed="false">Ver asistencia del equipo</button></div>
<section id="person-view"><label>Persona<select id="employee"><option value="">Selecciona una persona</option></select></label><div id="person-content"></div></section>
<section id="team-view" hidden aria-labelledby="attendance-team-title"></section></section>
</main></body></html>
