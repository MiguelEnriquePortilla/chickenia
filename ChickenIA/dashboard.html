<body class="points-active dashboard-feed">

<div id="password-gate" class="password-gate">

    <img src="https://www.chicanito.app/assets/brand/logo-badge.jpg" alt="Chicanito" />
  </div>
  <h1 class="wordmark wordmark-lg on-dark gate-title"><span class="w-chicken">Chicken</span> <span class="w-chican">Chican</span><span class="w-ia">IA</span></h1>
  <p class="gate-subtitle">Comprobando tu sesión de Chicken ChicanIA…</p>
  <p id="gate-error" class="gate-error"></p>
</div>

<div id="app-content" hidden>
<header class="app-header">
  <div class="mascot-badge mascot-badge--small">
    <img src="https://www.chicanito.app/assets/brand/logo-badge.jpg" alt="Chicanito" />
  </div>
  <a href="/index.html" class="brand wordmark on-dark"><span class="w-chicken">Chicken</span> <span class="w-chican">Chican</span><span class="w-ia">IA</span></a>
  <span class="page-title">Resumen del día</span><a class="nav-return dashboard-home" href="/" aria-label="Inicio"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 10l9-7 9 7 M5 9v12h14V9 M9 21v-8h6v8"/></svg>Inicio</a>

      <hr />
      <button id="menu-logout" type="button">Cerrar sesión</button>
    </div>
  </div>
</header>

<div class="controls-bar">
  <label>Fecha
    <input type="date" id="date-input" />
  </label>
  <div id="critical-pending" class="crit-chip" style="display:none;"></div>
  <div class="overall-score-box">
    <span class="overall-score-label">Avance del checklist</span>
    <span id="overall-score" class="overall-score-value">—</span>
  </div>
</div>

<div id="area-status-bar" class="area-status-bar" style="display:none;"></div>

<main class="dashboard-grid">
  <details class="summary-section" id="resumen-evaluation" open><summary>Evaluaciones</summary><div class="summary-section-tools"><button type="button" data-summary-report="evaluation" disabled>Compartir por WhatsApp</button></div><section id="equipo-weekly" aria-label="Evaluación semanal del equipo"><p>Cargando evaluación del equipo…</p></section></details>
  <link rel="stylesheet" href="/css/equipo-weekly.css">
  <section id="checklist-timeline" data-view="dashboard" aria-label="Gráfico de cortes por área"><p>Cargando cortes del checklist…</p></section>

  <details class="summary-section" id="resumen-production" ><summary>Producción</summary><div class="summary-section-tools"><button type="button" data-summary-report="production" disabled>Compartir por WhatsApp</button></div><section id="daily-captures" aria-label="Producción"></section></details>

      <h2>Actividades verificadas por área</h2>
      <span class="acc-chevron">▸</span>
    </button>
    <div id="areas" inert></div>
  </section>

</main>
