<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17213e"><title>Nómina · Chicken ChicanIA</title>
<link rel="icon" href="/icons/chicania-launch-32.png"><link rel="manifest" href="/manifest.json"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/js/theme-init.js"></script><link rel="stylesheet" href="/css/area-navigation.css"><link rel="stylesheet" href="/css/shared-shell.css"><link rel="stylesheet" href="/css/payroll.css">
<script defer src="/js/area-navigation.js"></script><script defer src="/js/shared-shell.js"></script><script defer src="/js/payroll-domain.js"></script><script defer src="/js/payroll.js"></script><script defer src="/js/name-access.js"></script>
</head><body data-shared-standalone="true" data-personnel-view="payroll">
<main id="personal-app" class="personnel-main">
<div class="page-heading"><h1>Nómina</h1><p id="identity" class="quiet"></p><button id="change-person" class="text-action" type="button" hidden>Cambiar responsable</button></div>
<section id="login-panel" hidden><h2>Acceso de Lilian</h2><p>Si aún no has seleccionado tu nombre, <a href="/asistencias.html">entra primero a Asistencias</a>.</p><form id="login-form"><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Entrar</button></form></section>
<div class="save-message" role="status" aria-live="polite"><span id="status">Cargando…</span><button type="button" id="retry" hidden>Reintentar</button><button type="button" id="recover" hidden>Recuperar guardado</button></div>
<section id="workspace" hidden>
<div class="context-fields"><label id="date-label">Semana del lunes<input id="date" type="date"></label><p id="period" class="quiet"></p></div>
<div class="view-tabs" role="group" aria-label="Vista de nómina"><button type="button" data-view="person" aria-pressed="true">Por persona</button><button type="button" data-view="team" aria-pressed="false">Equipo</button></div>
<section id="person-view"><button type="button" class="text-action" id="back-team" hidden>Volver al equipo</button><label>Persona<select id="employee"><option value="">Selecciona una persona</option></select></label><div id="person-content"></div></section>
<section id="team-view" hidden></section><section id="authorization" class="approval-section"></section>
</section>
<section id="share-preview" class="report-preview" hidden aria-labelledby="preview-title"><p class="report-brand">Chicken Chicanito · Nómina semanal</p><h2 id="preview-title">Vista previa del reporte</h2><p class="quiet" id="report-state"></p><div id="report-content"></div><div class="action-row"><button type="button" id="whatsapp" class="primary">Continuar a WhatsApp</button><button type="button" id="print">Imprimir</button><button type="button" id="pdf">Guardar en PDF</button><button type="button" id="close-preview">Volver</button></div><p class="quiet">En WhatsApp eliges el destinatario y confirmas el envío. Para PDF, elige «Guardar como PDF» en el diálogo de impresión.</p></section>
</main></body></html>
