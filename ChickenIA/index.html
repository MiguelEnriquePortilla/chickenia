<title>Chicken ChicanIA</title>
<script>try{if(localStorage.getItem('chickenia_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<script>
// Paint the approved splash first; internal returns and reduced motion go straight home.
(()=>{try{
 const stamp=Number(sessionStorage.getItem('chickenia_internal_home'));
 if(stamp>0&&Date.now()-stamp<15000||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 document.documentElement.classList.add('welcome-pending');
 setTimeout(()=>{if(!document.documentElement.classList.contains('welcome-pending'))return;
 document.documentElement.classList.remove('welcome-pending');
 const screen=document.getElementById('chicken-welcome'),home=document.getElementById('chicken-home');
 if(screen)screen.hidden=true;if(home){home.inert=false;home.removeAttribute('aria-hidden');}document.body?.classList.remove('welcome-active');
 },5500);
}catch{}})();
</script>
<style>.welcome-pending{background:#17213e}.welcome-pending #chicken-welcome[hidden]{display:flex!important}.welcome-pending #chicken-home{visibility:hidden}</style>
