<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chicken ChicanIA</title>
<script>try{if(localStorage.getItem('chickenia_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<script>
// Paint the approved splash first; internal returns and reduced motion go straight home.
(()=>{try{
 const stamp=Number(sessionStorage.getItem('chickenia_internal_home'));
 if(stamp>0&&Date.now()-stamp<15000||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 document.documentElement.classList.add('welcome-pending');
 setTimeout(()=>{if(!document.documentElement.classList.contains('welcome-pending'))return;
 document.documentElement.classList.remove('welcome-pending');
 const screen=document.getElementById('chicken-welcome'),home=document.getElementById('chicken-home');
 if(screen)screen.hidden=true;if(home){home.inert=false;home.removeAttribute('aria-hidden');}document.body?.classList.remove('welcome-active');
 },5500);
}catch{}})();
</script>
<style>.welcome-pending{background:#17213e}.welcome-pending #chicken-welcome[hidden]{display:flex!important}.welcome-pending #chicken-home{visibility:hidden}</style>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#17213E" />
<link rel="icon" href="/icons/chicania-launch-32.png" />
<link rel="apple-touch-icon" href="/icons/chicania-launch-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Chicken ChicanIA" />
<link rel="stylesheet" href="/css/style.css" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/refined.css">
<link rel="preload" as="image" href="/icons/welcome-mascot.webp" />
<link rel="stylesheet" href="/css/welcome.css">
<script src="/js/refined.js" defer></script>
<script src="/js/welcome.js" defer></script>
<link rel="stylesheet" href="/css/polish.css"><script defer src="/js/nav-polish.js"></script><link rel="stylesheet" href="/css/home.css"><link rel="stylesheet" href="/css/brand-theme.css"></head>
<body class="home-page">
<section id="chicken-welcome" class="chicken-welcome" aria-label="Bienvenida a Chicken ChicanIA" hidden>
  <div class="chicken-welcome__stage"><div class="chicken-welcome__sphere" aria-hidden="true"></div><div class="chicken-welcome__pulse chicken-welcome__pulse--one" aria-hidden="true"></div><div class="chicken-welcome__pulse chicken-welcome__pulse--two" aria-hidden="true"></div><img class="chicken-welcome__mascot" src="/icons/welcome-mascot.webp" width="1024" height="1536" alt="Mascota de Chicken ChicanIA" fetchpriority="high" decoding="async" /></div>
  <p class="chicken-welcome__speech"><span>Haz tu día un día </span><strong>VERY SABROSITO</strong></p>
  <p class="chicken-welcome__brand">Chicken Chican<span class="w-ia">IA</span></p>
  <p class="chicken-welcome__message">Control operativo</p>
  <button class="chicken-welcome__skip" type="button">Entrar ahora</button>
</section>
<div class="home-screen" id="chicken-home">
<header class="home-header daily-header"><div class="home-brand"><img src="/icons/sello-2026.png" width="42" height="42" alt="Sello de Chicken Chicanito"><div><span>Chicken Chican<strong class="brand-ia">IA</strong></span></div></div></header>
<main class="home-content"><h1>Supervisión</h1><p class="home-date" id="home-date"></p>
<nav class="home-supervision-links" aria-label="Supervisión de áreas">
<a class="home-primary" href="/evaluacion-equipo.html"><span><strong>Revisar áreas</strong><small>Abre las actividades de hoy.</small></span><img class="home-primary-mascot" src="/icons/welcome-mascot.webp" width="68" height="102" alt="" decoding="async"></a>
<a class="home-history" href="/evaluacion-equipo.html?view=history">Ver historial <span aria-hidden="true">›</span></a>
</nav>
</main><footer class="home-footer">Chicken Chicanito</footer>
</div>
<script>document.getElementById('home-date').textContent=new Intl.DateTimeFormat('es-MX',{timeZone:'America/Mexico_City',weekday:'long',day:'numeric',month:'long'}).format(new Date());</script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(function(){}); }</script>
</body>
</html>
