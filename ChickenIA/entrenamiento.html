<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red:#E30613; --navy:#17213E; --gold:#D9A441; --gray:#6b7280; --border:#d6d6d6;
  }
  * { box-sizing:border-box; }
  body { font-family:'Poppins',sans-serif; margin:0; color:#1D1D1B; background:#e9e9e9; }

  .toolbar { position:sticky; top:0; background:var(--navy); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:16px; z-index:10; }
  .toolbar button { background:var(--red); color:#fff; border:none; padding:10px 18px; border-radius:999px; font-weight:600; cursor:pointer; font-family:inherit; font-size:14px; }
  .toolbar p { margin:0; font-size:13px; opacity:.85; }

  .area-page { background:#fff; width:27.7cm; min-height:20.5cm; margin:18px auto; padding:1.1cm 1.3cm; box-shadow:0 2px 10px rgba(0,0,0,.18); }

  .sheet-header { display:flex; align-items:center; gap:14px; border-bottom:3px solid var(--gold); padding-bottom:8px; margin-bottom:10px; }
  .badge { width:44px; height:44px; border-radius:50%; border:2px solid var(--gold); overflow:hidden; flex-shrink:0; }
  .badge img { width:100%; height:100%; object-fit:cover; display:block; }
  .sheet-title { font-family:'Bebas Neue',sans-serif; font-size:26px; color:var(--navy); letter-spacing:.5px; line-height:1; }
  .sheet-sub { font-size:11px; color:var(--gray); margin-top:2px; }

  .meta-line { display:flex; gap:32px; font-size:12px; margin-bottom:10px; }
  .meta-line span { border-bottom:1px solid #999; padding:2px 60px 2px 4px; white-space:nowrap; }

  table { width:100%; border-collapse:collapse; font-size:9.3pt; table-layout:fixed; }
  thead { display:table-header-group; }
  tr { page-break-inside:avoid; }
  th, td { border:1px solid var(--border); padding:3px 5px; vertical-align:middle; }
  th { background:#f6f3ec; font-weight:600; font-size:8.8pt; color:var(--navy); text-align:center; }
  th.act-th { text-align:left; }
  col.crit-col { width:14px; }
  col.day-col { width:32px; }
  td.crit-cell { text-align:center; }
  td.act-cell { text-align:left; }
  .act-target { display:block; font-size:7.3pt; color:var(--gray); margin-top:1px; }
  .crit-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--red); }
  .blank-cell { height:20px; }
  .legend { font-size:8.5pt; color:var(--gray); margin-top:6px; display:flex; align-items:center; gap:6px; }

  @media print {
    body { background:#fff; }
    .toolbar { display:none; }
    .area-page { box-shadow:none; margin:0; width:auto; min-height:auto; page-break-after:always; }
    .area-page:last-child { page-break-after:auto; }
    @page { size:letter landscape; margin:1cm; }
  }
</style>
</head>

function renderArea(area) {
  const dayHeaders = DAYS.map(d => `<th class="day-col">${d}</th>`).join('');

  let rows;
  if (area.activities) {
    let previousBlock;
    const blocks = { apertura: 'Rutina de apertura', operacion: 'Operación durante el día', cierre: 'Rutina de cierre' };
    rows = area.activities.map(([name, crit, reqQty, unit, , target, block, frequency]) => {
      const heading = block && block !== previousBlock ? `<tr><th colspan="9" style="text-align:left">${blocks[block]}</th></tr>` : '';
      previousBlock = block;
      const dot = crit === 'critica' ? '<span class="crit-dot" title="Actividad crítica"></span>' : '';
      const sub = (reqQty || block) ? `<span class="act-target">${target ? 'Meta: ' + target : (unit || '')}</span>` : '';
      const dayCells = DAYS.map(() => '<td class="day-col blank-cell"></td>').join('');
      return `${heading}<tr><td class="crit-cell">${dot}</td><td class="act-cell"><span class="act-name">${name}${frequency==='weekly'?' · SEMANAL: solo fecha programada':''}</span>${sub}</td>${dayCells}</tr>`;
    }).join('');
  } else {
    const dayCells = DAYS.map(() => '<td class="day-col blank-cell"></td>').join('');
    rows = Array.from({ length: area.blankRows })
      .map(() => `<tr><td class="crit-cell"></td><td class="act-cell blank-cell"></td>${dayCells}</tr>`)
      .join('');
  }

  return `
  <section class="area-page">
    <div class="sheet-header">
      <div class="badge"><img src="https://www.chicanito.app/assets/brand/logo-badge.jpg" alt="Chicanito" /></div>
      <div>
        <div class="sheet-title">${area.name}</div>
        <div class="sheet-sub">Hoja de entrenamiento — verificación semanal (L a D)</div>
      </div>
    </div>
    <div class="meta-line">
      <span>Semana del:</span>
      <span>Supervisor:</span>
    </div>
    <table>
      <colgroup>
        <col class="crit-col" />
        <col />
        ${DAYS.map(() => '<col class="day-col" />').join('')}
      </colgroup>
      <thead>
        <tr>
          <th></th>
          <th class="act-th">Actividad</th>
          ${dayHeaders}
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="legend"><span class="crit-dot"></span> actividad crítica</div>
  </section>`;
}

document.getElementById('sheets').innerHTML = AREAS.map(renderArea).join('');
