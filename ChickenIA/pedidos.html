<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LISTA DE PEDIDOS</title><meta name="theme-color" content="#17213e"><link rel="icon" href="/icons/chicania-launch-32.png"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/area-navigation.css"><link rel="stylesheet" href="/css/shared-shell.css"><link rel="stylesheet" href="/css/regular-orders.css"><script>try{if(localStorage.getItem('chickenia_theme')==='dark')document.documentElement.dataset.theme='dark';}catch{}</script><script src="/js/area-navigation.js"></script><script defer src="/js/shared-shell.js"></script><script defer src="/js/regular-orders-data.js"></script><script defer src="/js/regular-orders.js"></script></head>
<body data-shared-standalone="true"><main class="orders-main"><header><h1>Pedidos</h1><p>Elige proveedor y anota cuánto pedir.</p></header><nav id="suppliers" aria-label="Proveedor"></nav><section id="editor"><p class="orders-hint">Borrador en este dispositivo. Existencia vacía: sin conteo; 0: sin existencias.</p><p id="orders-status" role="status" aria-live="polite"></p><div class="orders-filters"><label>Buscar producto<input id="product-search" type="search" placeholder="Nombre del producto" autocomplete="off"></label><label class="orders-requested"><input id="requested-only" type="checkbox"> Solo cantidades a pedir</label></div><p id="orders-results" role="status" aria-live="polite"></p><div id="products"></div><div class="orders-tools"><button id="clear" type="button">Limpiar cantidades</button><button id="preview" type="button">Ver pedido para captura</button></div></section><section id="capture" hidden><h2 id="capture-title"></h2><p id="capture-date"></p><div id="capture-lines"></div><p id="capture-note"></p></section><label class="orders-note">Nota para el proveedor<textarea id="note" rows="2" maxlength="1000" placeholder="Indicaciones de entrega u observaciones"></textarea></label><div class="orders-actions"><button id="copy" type="button">Copiar pedido</button><button id="share" type="button">Compartir</button><button id="whatsapp" type="button">Abrir WhatsApp</button></div><div id="manual-copy" hidden><label>Copia este texto<textarea id="order-text" readonly rows="10"></textarea></label></div><noscript>Activa JavaScript para preparar tu pedido.</noscript></main></body></html>
